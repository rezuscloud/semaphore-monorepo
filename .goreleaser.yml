version: 2
dist: bin

before:
  hooks:
    - task build:fe

builds:
  - binary: semaphore
    env:
      - CGO_ENABLED=0
    main: ./cli/main.go
    ldflags: -s -w -X github.com/semaphoreui/semaphore/util.Ver={{ .Version }} -X github.com/semaphoreui/semaphore/util.Commit={{ .ShortCommit }} -X github.com/semaphoreui/semaphore/util.Date={{ .Timestamp }}
    tags:
      - netgo
    goos:
      - windows
      - darwin
      - linux
      - freebsd
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - ppc64le
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: 386
      - goos: freebsd
        goarch: ppc64le
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: ppc64le
      - goos: windows
        goarch: ppc64le
      - goos: windows
        goarch: arm

archives:
  - files:
      - LICENSE
    name_template: "{{ .Env.PROJECT_NAME }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "{{ .Env.PROJECT_NAME }}_{{ .Version }}_checksums.txt"

# Upstream GPG-signs the checksums file with the Semaphore UI release key.
# This distribution has no signing key yet — checksums ship unsigned; a
# rezus release key can restore this block verbatim.

snapshot:
  name_template: "{{ .Timestamp }}-{{ .ShortCommit }}-SNAPSHOT"

nfpms:
  - id: semaphore
    file_name_template: "{{ .Env.PROJECT_NAME }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    package_name: "semaphore"
    description: Modern UI and powerful API for Ansible, Terraform, OpenTofu, PowerShell and other DevOps tools.
    homepage: https://github.com/semaphoreui/semaphore
    vendor: Semaphore UI
    maintainer: Denis Gukov <denis@semaphoreui.com>
    license: MIT

    formats:
      - deb
      - rpm

    dependencies:
      - git

    suggests:
      - ansible

    bindir: /usr/bin

    # Embedded RPM signature (rpm -K). Skipped when GPG_KEY_PATH is not set
    # (e.g. local `task release:test`). Passphrase comes from the
    # NFPM_SEMAPHORE_PASSPHRASE environment variable.
    rpm:
      signature:
        key_file: '{{ envOrDefault "GPG_KEY_PATH" "" }}'

# Upstream publishes the release as a draft for manual sign-off. Tags here
# are machine-cut by the fork-maintenance engine after validated syncs, so
# the release publishes atomically.
release:
  draft: false
  name_template: "{{.Tag}}"
