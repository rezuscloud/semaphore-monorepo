      - name: Write config
        run: |
          cat > config.json <<EOF
            {
              "postgres": {
                "host": "localhost:5432",
                "user": "semaphore",
                "pass": "p455w0rd",
                "name": "semaphore",
                "options": {
                  "sslmode": "disable"
                }
              },
              "dialect": "postgres",
              "email_alert": false
            }
          EOF

      - name: Migrate database
        run: |
          chmod +x ./semaphore && ./semaphore migrate --config config.json

  migrate-sqlite:
    runs-on: [self-hosted, Linux, X64]

    needs:
      - build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: semaphore

      - name: Write config
        run: |
          cat > config.json <<EOF
            {
              "sqlite": {
                "host": "/tmp/db.sqlite"
              },
              "dialect": "sqlite",
              "email_alert": false
            }
          EOF

      - name: Migrate database
        run: |
          chmod +x ./semaphore && ./semaphore migrate --config config.json

