name: CI

'on':
  push:
    branches:
      - rezus/2-19
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Naming guard
        run: |
          # This distribution carries no edition vocabulary. Exclusions, each
          # justified: web/public = vendored third-party bundles (swagger-ui);
          # web/package-lock.json = third-party dependency manifest;
          # web/src/lang = "pro" is an ordinary word in cs/pl/uk sentence text;
          # db/sql/migrations = immutable migration history; the literal
          # "Vault Enterprise" names HashiCorp's product, not an edition of
          # this application.
          set -e
          hits=$(git grep -nIE 'pro_impl|pro_interfaces|semaphorepro|APP_BUILD_TYPE|VUE_APP_BUILD_TYPE|pro_selfhosted|pro_portal' -- . ':(exclude).github/workflows/dev.yml' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::edition-machinery vocabulary found"; exit 1; fi
          hits=$(git grep -inIE '\b(pro|enterprise)s?\b' -- \
            ':(exclude)web/public' ':(exclude)web/package-lock.json' ':(exclude)web/src/lang' \
            ':(exclude)db/sql/migrations' ':(exclude).github/workflows/dev.yml' \
            | grep -v 'Vault Enterprise' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::edition name found"; exit 1; fi

      - name: Setup golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Lint (gofmt + go vet)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::files not gofmt-formatted"
            exit 1
          fi
          go vet ./...
          go vet -C .dredd/hooks .

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install deps
        run: |
          task deps

      - name: Run build
        run: task build

      - name: Check modification
        run: |
          git diff --exit-code --stat -- . ':(exclude)web/package.json' ':(exclude)web/package-lock.json' ':(exclude)go.mod' ':(exclude)go.sum'

      - name: Run tests
        run: task test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semaphore
          path: bin/semaphore
          retention-days: 1

      # The dredd hooks drive the API integration jobs below; they build from
      # the sources in this repository only.
      - name: Build dredd hooks
        run: task dredd:hooks

      - name: Upload dredd hooks
        uses: actions/upload-artifact@v4
        with:
          name: dredd-hooks
          path: .dredd/compiled_hooks
          retention-days: 1

  image:
    runs-on: [self-hosted, Linux, X64]

    needs:
      - build

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Proves the release Dockerfile path on every PR. The push itself stays
      # in release.yml (tag-triggered).
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/server/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false

  migrate-mysql:
    runs-on: [self-hosted, Linux, X64]

    needs:
      - build

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p455w0rd
          MYSQL_USER: semaphore
          MYSQL_PASSWORD: p455w0rd
          MYSQL_DATABASE: semaphore
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: semaphore

      - name: Write config
        run: |
          cat > config.json <<EOF
            {
              "mysql": {
                "host": "localhost:3306",
                "user": "semaphore",
                "pass": "p455w0rd",
                "name": "semaphore"
              },
              "dialect": "mysql",
              "email_alert": false
            }
          EOF

      - name: Migrate database
        run: |
          chmod +x ./semaphore && ./semaphore migrate --config config.json

  migrate-mariadb:
    runs-on: [self-hosted, Linux, X64]

    needs:
      - build

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: p455w0rd
          MARIADB_USER: semaphore
          MARIADB_PASSWORD: p455w0rd
          MARIADB_DATABASE: semaphore
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: semaphore

      - name: Write config
        run: |
          cat > config.json <<EOF
            {
              "mysql": {
                "host": "localhost:3306",
                "user": "semaphore",
                "pass": "p455w0rd",
                "name": "semaphore"
              },
              "dialect": "mysql",
              "email_alert": false
            }
          EOF

      - name: Migrate database
        run: |
          chmod +x ./semaphore && ./semaphore migrate --config config.json

