      - name: Write config.stdin
        run: |
          cat > config.stdin <<EOF
          1
          localhost:3306
          semaphore
          p455w0rd
          semaphore
          /tmp/semaphore
          http://localhost:3000
          no
          no
          no
          no
          no
          no
          $(pwd)/.dredd
          admin
          admin@localhost
          Developer
          password
          EOF

      - name: Execute setup
        run: |
