      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: semaphore

      - name: Write config.stdin
        run: |
          cat > config.stdin <<EOF
          1
          localhost:3306
          semaphore
          p455w0rd
          semaphore
          /tmp/semaphore
          http://localhost:3000
          no
          no
          no
          no
          no
          no
          $(pwd)/.dredd
          admin
          admin@localhost
          Developer
          password
          EOF

      - name: Execute setup
        run: |
          chmod +x ./semaphore && ./semaphore setup - < config.stdin

      - name: Download dredd hooks
        uses: actions/download-artifact@v4
