# Tag-triggered fork release — builds the Rezus.cloud semaphore server image.
#
# The fork mints no version of its own (identity = upstream version):
# tags are machine-cut by the harmostes fork-maintenance engine as
# v<upstream-ver>-rezus.<N+1> after every validated sync. This workflow is
# the fork's ONLY release path (fork repos stay clean: upstream code +
# patches + this one workflow — no sync scripts, no manifests here).
#
# Image: ghcr.io/rezuscloud/semaphore — OSS build (APP_BUILD_TYPE="" is the
# Dockerfile default; no pro module, no GH_TOKEN needed).
name: release

on:
  push:
    tags:
      - "v*-rezus.*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"   # v2.19.14-rezus.1 -> 2.19.14-rezus.1
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/rezuscloud/semaphore:${{ steps.meta.outputs.version }}
            ghcr.io/rezuscloud/semaphore:latest
